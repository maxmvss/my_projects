<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <label for="Name">Имя </label>
      <input type="text" id="Name" />

      <label for="passkey">Пароль </label>
      <input type="text" id="passkey" />

      <label for="email">Email </label>
      <input type="email" id="email" />

      <label for="age">Возраст </label>
      <input type="number" id="age" />

      <label for="date">Дата </label>
      <input type="date" id="date" />

      <label for="student">Студент?</label>
      <input type="checkbox" id="student" />

      <label for="marketing">Маркетинг</label>
      <input type="radio" name="directon" value="marketing" id="marketing" />
      <label for="IT">IT</label>
      <input type="radio" name="directon" value="IT" id="IT" />

      <label for="msg">Сообщение</label>
      <textarea id="msg" rows="4"></textarea>

      <label for="topic">Тема</label>
      <select id="topic">
        <option value="Question">Вопрос</option>
        <option value="Offe">Предложение</option>
      </select>

      <button type="submit">Отправить</button>
    </form>
  </body>
</html>
